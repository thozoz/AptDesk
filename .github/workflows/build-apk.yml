# Builds a debuggable APK and attaches it to GitHub Releases.
# Fixes: Quick Start links to APK downloads, but releases contain no APK.
#
# - On `release: published` → builds + attaches APK to that release.
# - On `workflow_dispatch` → builds, uploads as workflow artifact (no publish).
#
# Beta note: builds `assembleDebug` (debug-signed, installable, no keystore
# secrets needed). Release/AAB signing stays local via keystore.properties.

name: Build APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (frontend dashboard build)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ubuntu-* runners ship an Android SDK; just ensure API 35 + build-tools exist.
      # (android-actions/setup-android@v3 is unusable: it installs the removed
      # obsolete `tools` package and fails on current images.)
      - name: Ensure Android API 35 SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "aptdesk-${{ github.ref_name }}-debug.apk"

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: aptdesk-*.apk

      - name: Upload APK artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
